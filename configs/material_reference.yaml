# ---------------------------------------------------------------------------
# COMPONENTS
#
# The selection layer. Each subtype names, per metal, the evidence id that
# supplies its figure. No value appears here - only references - so a figure
# can never drift from the record that justifies it.
# ---------------------------------------------------------------------------
components:

  PCB:
    default_subtype: generic_wpcb
    subtypes:
      generic_wpcb:
        description: >
          A waste printed circuit board of unspecified origin. What Aurum
          should assume when it has only detected "a board".
        composition:
          Au: PCB-AU-002
          Ag: PCB-AG-002
          Pd: PCB-PD-001
          Cu: PCB-CU-002
          Ni: PCB-NI-002
          Sn: PCB-SN-002
          Al: PCB-AL-001
      desktop_motherboard_early_generation:
        description: >
          A desktop motherboard of the XT / 486 / Pentium era. Directly
          measured, but not representative of a modern board.
        composition:
          Au: PCB-AU-001
          Ag: PCB-AG-001
          Cu: PCB-CU-001
          Ni: PCB-NI-001
          Sn: PCB-SN-001
      server_motherboard:
        description: "A multi-layer server board. Mass reference only."
        composition: {}
        mass: PCB-MASS-001

  CPU:
    default_subtype: bga_pga_package
    subtypes:
      bga_pga_package:
        description: >
          A processor in a ball-grid-array or pin-grid-array package, as
          dismantled from waste boards.
        composition:
          Au: CPU-AU-001
        upper_bound_subtype: null

  Connector:
    default_subtype: general_connector
    subtypes:
      general_connector:
        description: >
          A connector of unspecified grade - what a bare "Connector" detection
          justifies.
        composition:
          Au: CONN-AU-001
        upper_bound_subtype: high_grade_connector
      high_grade_connector:
        description: "A connector in the high-grade sub-class."
        composition:
          Au: CONN-AU-002
      gold_fingers:
        description: >
          A stamp-sheared gold-finger contact strip. Concentration data only;
          the strip mass is unreported, so no per-piece figure can be derived.
        composition:
          Au: CONN-AU-003
          Ag: CONN-AG-001
          Cu: CONN-CU-001
          Ni: CONN-NI-001
          Al: CONN-AL-001

  RAM:
    default_subtype: dimm_module
    subtypes:
      dimm_module:
        description: >
          A DIMM / SO-DIMM / RDIMM memory module. NO COMPOSITION DATA - see
          `gaps.RAM`. The mass reference exists but has nothing to multiply.
        composition: {}
        mass: RAM-MASS-001

# ---------------------------------------------------------------------------
# RECOVERY
#
# Kept strictly apart from composition. A recovery factor is applied only when
# a source measured recovery FROM A FEED THAT MATCHES WHAT AURUM DETECTED.
# `applies_to_detection: false` means the figure is real but its measurement
# context does not match a whole detected component, so the estimator will not
# use it. That is a refusal, not a missing value.
# ---------------------------------------------------------------------------
recovery:
  available: false
  reason: >
    No cited recovery factor applies to a whole detected component. The only
    recovery figures in the database were measured on a liberated, stamp-sheared
    and chemically decopperized gold-finger feed, which is a processed
    intermediate rather than a component a camera can see. Applying them to a
    detected connector would silently assume a full pre-treatment chain that
    Aurum has neither performed nor observed.

  factors:
    - id: CONN-AU-REC-001
      component: Connector
      subtype: gold_fingers
      metal: Au
      recovery_rate: 88.7
      unit: "%"
      process: >
        Ammonia thiosulfate leaching, 4 h residence, 50 mM Cu(II), 0.5 M
        thiosulfate, 0.5 M NH3, 120 mL/min aeration, 25 C.
      feed_description: "Decopperized gold fingers (after a copper pre-leach)."
      scale: laboratory
      source: LIN2023
      evidence_type: measured
      confidence: high
      applies_to_detection: false
      applies_reason: >
        The feed was stamp-sheared from modules and then decopperized. A
        detected connector has undergone neither step.

    - id: CONN-AU-REC-002
      component: Connector
      subtype: gold_fingers
      metal: Au
      recovery_rate: 12.7
      unit: "%"
      process: "Ammonia thiosulfate leaching, 4 h, no pre-treatment."
      feed_description: "As-stamped gold fingers, no pre-treatment."
      scale: laboratory
      source: LIN2023
      evidence_type: measured
      confidence: high
      applies_to_detection: false
      applies_reason: >
        Still a stamp-sheared strip rather than a whole connector. Recorded
        because it shows how sharply recovery depends on pre-treatment: the
        same feed and reagent system moves from 12.7 % to 88.7 % on one
        upstream step, which is why a generic "industry standard" recovery
        percentage would be meaningless.

    - id: CONN-AU-REC-003
      component: Connector
      subtype: gold_fingers
      metal: Au
      recovery_rate: 98
      unit: "%"
      process: >
        Optimized ammonia thiosulfate leaching: 50 mM Cu(II), 120 mL/min
        aeration, 0.5 M (NH3)2S2O3, 0.75 M NH4OH, 4 h, 25 C.
      feed_description: "Gold fingers under optimized leach conditions."
      scale: laboratory
      source: LIN2023
      evidence_type: measured
      confidence: high
      applies_to_detection: false
      applies_reason: >
        A best-case laboratory optimum on a prepared feed. Presenting this as
        the recovery of a detected connector would be the single most
        misleading number this repository could publish.

# ---------------------------------------------------------------------------
# GAPS - stated, not filled
# ---------------------------------------------------------------------------
gaps:
  RAM:
    missing: [Au, Ag, Pd, Pt, Cu, Ni, Sn, Al]
    reason: >
      No source giving whole-RAM-module composition could be read in full. The
      closest study (CHARLES2017, AAS on DRAM modules from 1991-2008) is
      nominally open access but its full text was unreachable, so its tables
      were never inspected and no number was taken from it. LIN2023 measures
      only the sheared gold-finger edge, and FIRSCHING2024 explicitly states
      that gold-finger figures were not yet available. A detected RAM module
      therefore returns `available: false`.
  CPU:
    missing: [Ag, Pd, Pt, Cu, Ni, Sn, Al]
    reason: >
      Only gold was found for processor packages, from FIRSCHING2024. No
      source read gave silver, palladium or platinum per CPU package.
  Connector:
    missing: [Pd, Pt, Sn]
    reason: "No palladium, platinum or tin figure was found for connectors."
  PCB:
    missing: [Pt]
    reason: >
      Neither source read reports platinum in printed circuit boards. Platinum
      is generally associated with hard disk platters and catalysts rather
      than with boards, and no figure is invented here.
  all_components:
    subtype_detection: >
      Aurum's vision model cannot distinguish these subtypes from an image. A
      "Connector" detection does not establish gold plating; a "PCB" detection
      does not establish whether the board is a modern laptop board or a 1990s
      desktop board. The default subtype is a stated assumption, not an
      observation.
