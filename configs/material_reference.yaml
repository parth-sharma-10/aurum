# Aurum — evidence-backed material reference database
#
# ===========================================================================
# WHAT THIS FILE IS
#
# Aurum Vision identifies four component classes from an image. It cannot see
# composition. This file is the separate, citable layer that maps a detected
# class to published material data, so that an estimate can be produced without
# pretending the camera measured anything.
#
#   detected components   <- the only thing the model measured
#         x reference composition   (this file, `evidence` + `components`)
#   estimated material present      <- an ESTIMATE
#         x recovery factor, only where cited  (this file, `recovery`)
#   estimated recoverable material  <- an ESTIMATE of an ESTIMATE
#         x price per unit          (configs/price_reference.yaml)
#   estimated value
#
# RULES THIS FILE FOLLOWS
#
#   1. Every numeric value names a `source` id defined in
#      docs/sources/material_sources.yaml, and an `evidence` id that is unique
#      across this file. A figure that cannot be traced to a read paper is not
#      in this file.
#   2. Composition and recovery are separate sections and are never derived
#      from one another. "Metal present" is not "metal recoverable".
#   3. Where a class has no defensible figure it is ABSENT, not estimated.
#      RAM has no composition entry for exactly this reason - see `gaps`.
#   4. Original units are preserved in `original_value`/`original_unit`.
#      Conversions are recorded, exact, and re-checked by tests
#      (1 mg/kg = 1 ppm = 1 g/tonne; 1 % = 10 000 mg/kg).
#   5. Nothing here is an assay of any individual object.
# ===========================================================================

enabled: true
schema_version: "1.0"

basis: >
  Component counts from Aurum Vision multiplied by published reference material
  data. Per-piece figures multiply the count directly; concentration figures
  additionally require a mass, and are only applied against a MEASURED batch
  mass. Not a measurement of this batch's actual metal content.

units:
  concentration: "mg/kg"   # identical to ppm and to g/tonne
  per_piece: "mg"          # milligrams of metal in one component
  mass: "g"

# ---------------------------------------------------------------------------
# EVIDENCE
#
# One record per measurement. `quantity` decides how the estimator may use it:
#
#   per_piece      mg of metal in one detected component -> count x value
#   concentration  mg of metal per kg of material -> needs a mass
#   mass           g of one component, for concentration -> mass conversion
#
# `evidence_type`: measured | aggregated
# `confidence`:    high | medium | low
# ---------------------------------------------------------------------------
