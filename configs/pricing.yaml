# Aurum — metal price sourcing.
#
# ======================= NO LIVE PROVIDER IS CONFIGURED ====================
# `provider: unavailable` is the shipped default and it is not a placeholder
# awaiting a default value. No approved live market data source has been
# chosen for this project, so Aurum reports PRICE_UNAVAILABLE rather than
# producing a number.
#
# A spot price with no source and no timestamp behind it is worse than no
# price, because it gets screenshotted, quoted, and outlives the conversation
# that qualified it.
# ===========================================================================
#
# provider:
#   unavailable  every price is PRICE_UNAVAILABLE. The default.
#   static       read pinned prices from configs/price_reference.yaml. Every
#                price from this provider is labelled TEST and is never
#                reported as LIVE, SPOT, or a current market price.
#
# A live provider is added by implementing the PriceProvider protocol in
# app/valuation/prices.py and registering it here. PMDI code does not change.

pricing:
  provider: unavailable

  # ENGINEERING APPROXIMATION — not research-derived.
  # A quote older than this is reported STALE. Fifteen minutes is a defensible
  # prototype window for spot metals; a production deployment against a real
  # feed should set this from that feed's publication interval.
  max_age_seconds: 900
