# Aurum — the physical machine.
#
# Every value here is overridable by the AURUM_* environment variable named in
# app/config.py's SPEC table. Environment beats this file; this file beats the
# shipped defaults.
#
# UNMEASURED is a value, not a blank. It means nobody has put a tape measure or
# a scale to this quantity yet. Consumers must call `Config.require()`, which
# refuses to return it, so an unmeasured machine routes every item to Bin C
# instead of guessing where an item is on the belt. Replace each one with a
# number measured on the real rig.

conveyor:
  camera:
    index: 0
    # auto | CAP_DSHOW (Windows) | CAP_AVFOUNDATION (macOS) | CAP_MSMF | CAP_ANY
    backend: auto
    width: 1280
    height: 720

  detection:
    # Matches the demo and API default the v0.1 model was characterised at.
    # Source: reports/test_metrics.json (conf_threshold_for_examples).
    confidence: 0.35
    iou: 0.5

  # Where the belt speed comes from, and whether there is a belt at all.
  #
  #   NONE        no belt. The operator carries the object from the camera to
  #               the pan and routing is immediate. THE SHIPPED DEFAULT,
  #               because that is what this machine physically is.
  #   SIMULATION  the demonstration belt: the simulation profile below, with
  #               every derived figure stamped SIMULATED. Also switches the
  #               routing layer onto the TEST distances.
  #   ENCODER     roller pulses differentiated into a real speed.
  #   MANUAL      a real belt with no encoder, at a hand-measured speed.
  #
  # See app/routing/conveyor.py. Turning this on without a belt makes the
  # machine wait several seconds and fire a paddle at nothing.
  mode: NONE

  belt:
    # MEASURE THIS. Time a marked item over a known distance, repeat 5 times,
    # take the median. Timing error scales directly with speed: at 10 cm/s a
    # 200 ms scheduling error is 2 cm; at 50 cm/s it is 10 cm.
    #
    # Used when mode is MANUAL or ENCODER and nothing better is available.
    speed_cm_s: UNMEASURED

  manual:
    # MEASURE THIS if the belt has no encoder. Real, but entered once: it
    # cannot notice the belt slowing under load.
    belt_speed_cm_s: UNMEASURED

  encoder:
    # No encoder model is assumed - nobody has bought one - so both figures
    # are configuration. An UNMEASURED circumference makes every reading
    # UNAVAILABLE rather than papering over a missing tape measurement.
    pulses_per_revolution: 20
    roller_circumference_cm: UNMEASURED
    sample_interval_s: 0.25
    # Past this with no sample the encoder reads STALE and the scheduler
    # refuses. A belt nobody can hear is not a belt whose speed is known.
    timeout_s: 2.0

  geometry:
    # MEASURE THESE, along the belt, from the camera's field-of-view centre.
    camera_to_load_cell_cm: UNMEASURED
    camera_to_servo_a_cm: UNMEASURED
    camera_to_servo_b_cm: UNMEASURED

  timing:
    # Calibration knob. Positive fires later, negative fires earlier. Tune on
    # the real machine once geometry and speed are measured; no model of a belt
    # predicts its own latency correctly.
    offset_ms: 0
    # MEASURE THIS: command sent -> paddle physically in the stream.
    servo_actuation_delay_ms: UNMEASURED

  weight:
    # ENGINEERING APPROXIMATION — not research-derived.
    # A reading counts as stable when it stays within tolerance for the whole
    # window. 500 ms / 0.5 g is a starting point for a settling HX711; both
    # need tuning against the real load cell and the belt's vibration.
    stability_window_ms: 500
    stability_tolerance_g: 0.5
    # Give up waiting for a stable reading after this long; the item then has
    # no measured mass and routes to C.
    timeout_s: 5.0

    # ENGINEERING APPROXIMATION — not research-derived.
    # Samples in the median filter. Median rather than mean: one electrically
    # noisy sample should not move the answer, and a spike is exactly what a
    # mean would smear in.
    filter_samples: 5

    # The pan state machine — when an object has ARRIVED and when it has GONE.
    #
    # ENGINEERING APPROXIMATIONS — not research-derived. Tune against the real
    # cell's noise floor once it is mounted and calibrated.
    #
    # Note what is NOT here: stability. Deciding that a reading has settled is
    # already owned by weight.stability_window_ms / stability_tolerance_g above
    # and implemented in app/weight.py. These two thresholds answer a different
    # and much cruder question — is there something on the pan at all.
    pan:
      # Above this, an object is present. Well clear of drift on a settled pan.
      object_threshold_g: 5.0
      # Below this for clear_samples consecutive readings, the pan is empty
      # again and the next object may be accepted. Deliberately lower than
      # object_threshold_g: the gap is hysteresis, so an object hovering near
      # one threshold cannot rattle between arriving and leaving.
      clear_threshold_g: 2.0
      clear_samples: 5
      # How often the machine looks at the cell while idle.
      poll_interval_s: 0.05
      # The normal workflow: the load cell drives the measurement, no button.
      # Turning this off leaves POST /session/measure as the only path, which
      # is the developer fallback rather than the product.
      auto: true

    # MEASURE THIS: raw HX711 counts per gram, from a known reference mass.
    calibration_factor: UNMEASURED
    # Serial port of the board publishing load-cell readings. Null until wired.
    hx711_port: null

  arduino:
    # Actuation is OFF by default. Nothing is commanded to move until this is
    # deliberately switched on with the board connected and bench-verified.
    enabled: false

    # Null until a board is attached. Windows looks like COM3, macOS like
    # /dev/tty.usbmodem1101, Linux like /dev/ttyACM0. Never hardcode it.
    port: null
    # 115200 is what the physical board runs at. Must match the sketch.
    baudrate: 115200
    timeout_s: 1.0
    # MEASURED on the bench, 2026-08-26, against the attached board: a MOVE is
    # acknowledged 1.212 s after it is written. The board ACKs only once its
    # stroke routine has finished, so that figure is servo.actuation_ms plus
    # the sketch's own overhead, and it is the floor this value must clear.
    #
    # 2000 ms was not enough and produced a false ACK_TIMEOUT on a board that
    # was answering correctly. The margin is not arbitrary: a reply is only
    # noticed when a `next_response` budget ends, which is `timeout_s` (1.0 s)
    # wide, so the usable resolution here is one second, not one millisecond.
    # 4000 gives three whole polls against a 1.2 s answer.
    #
    # Raise this if servo.actuation_ms is raised. Lowering it below ~3000 will
    # start latching faults on strokes that completed.
    ack_timeout_ms: 4000

  # ==========================================================================
  # DEMONSTRATION PROFILE - TEST VALUES ONLY
  #
  # The physical conveyor does not exist yet. These numbers exist so the whole
  # pipeline can be demonstrated end to end, and they are NOT measurements of
  # anything. Every routing result computed from them is stamped
  # mode: SIMULATED.
  #
  # They are reachable ONLY when runtime.simulation is true OR mode is
  # SIMULATION. With both off, the geometry above applies and stays
  # UNMEASURED, so an unmeasured machine refuses to schedule rather than
  # routing on plausible-looking numbers. Do not move these values up into the
  # real geometry block.
  # ==========================================================================
  simulation:
    # 10 cm/s = 0.10 m/s. Slow on purpose: timing error from Python, serial
    # latency and inference jitter is roughly +/-200 ms, which is +/-2 cm at
    # this speed and +/-10 cm at 50 cm/s. Run a demonstration belt slow and
    # make the bin mouths wide.
    belt_speed_cm_s: 10.0            # TEST - a demonstration value, not a measurement
    camera_to_load_cell_cm: 25.0     # TEST
    camera_to_servo_a_cm: 60.0       # TEST
    camera_to_servo_b_cm: 90.0       # TEST
    servo_actuation_delay_ms: 150    # TEST
    timing_offset_ms: 0              # TEST

  servo:
    # BENCH/TEST VALUES - not calibrated conveyor geometry.
    #
    # These came from bench-testing Servo A and Servo B on their own. No paddle
    # has ever deflected an item, because there is no belt for an item to
    # travel on. Treat them as starting points to tune once a conveyor exists.
    #
    # The board reads these at boot over the CFG frame, so changing them here
    # does not require reflashing the sketch.
    rest_angle_deg: 0        # TEST/BENCH
    push_angle_deg: 90       # TEST/BENCH
    actuation_ms: 700        # TEST/BENCH - how long the paddle stays out

  runtime:
    # true runs the whole pipeline with no hardware, and switches the routing
    # layer onto the TEST geometry above. Simulated values are labelled
    # everywhere they appear and never enter production statistics.
    simulation: false
    host: 127.0.0.1
    port: 8000
