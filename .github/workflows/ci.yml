name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyTorch has no stable wheels for 3.14; the project pins 3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: CI never trains, and the CUDA build is ~2 GB.
          pip install torch==2.13.0 torchvision==0.28.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # The suite runs on a clean checkout with no trained weights and no
        # dataset: API tests use a stub detector, and the pipeline tests cover
        # pure functions. Nothing here needs a Roboflow key.
        run: pytest -q

      - name: Verify documentation generators run
        # Output is deliberately NOT diffed against the committed docs: some
        # inputs are gitignored (runs/, models/*.pt), so CI legitimately
        # produces a shorter document than a developer machine, and comparing
        # them would fail for a reason unrelated to correctness.
        run: |
          python scripts/gen_model_card.py
          python scripts/gen_evaluation.py

      - name: Verify the generators degrade honestly without metrics
        # The property that matters: with no measured results available, the
        # documentation must say so rather than crashing or emitting a
        # placeholder figure someone could quote. Tested by removing the
        # metrics file rather than by assuming the checkout lacks it — the
        # repository now commits reports/test_metrics.json as evidence, so
        # asserting on repository state would test the wrong thing.
        run: |
          set -e
          test -f reports/test_metrics.json || { echo "::error::reports/test_metrics.json should be committed as evidence"; exit 1; }
          mv reports/test_metrics.json /tmp/test_metrics.json
          python scripts/gen_model_card.py
          python scripts/gen_evaluation.py
          grep -q "Not yet evaluated" docs/model-card.md \
            || { echo "::error::model card must report evaluation as pending when reports/test_metrics.json is absent"; exit 1; }
          grep -q "Not yet measured" docs/evaluation.md \
            || { echo "::error::evaluation report must report results as pending when reports/test_metrics.json is absent"; exit 1; }
          mv /tmp/test_metrics.json reports/test_metrics.json
          git checkout -- docs/
