[project]
name = "aurum-vision"
version = "0.1.0"
description = "Real-time e-waste component identification for Project Aurum"
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "runs", "models", "reports"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally assert on expressions rather than binding them.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `app` and `ml` import without an
# editable install. Without this, bare `pytest` fails while `python -m pytest`
# succeeds — only the latter adds the working directory — which makes the test
# command work or not depending on how it was typed.
pythonpath = ["."]
filterwarnings = [
    # Our own deprecated API usage is a build failure, not a note. This is how
    # FastAPI's removed on_event() handler was caught.
    "error::DeprecationWarning:app.*",
    "error::DeprecationWarning:ml.*",
    # Third-party: Starlette's TestClient warns that it uses httpx rather than
    # httpx2. Nothing in this project can act on it — the transport is chosen
    # inside Starlette — and pinning httpx2 would be a test-only dependency
    # change for no behavioural gain. Reviewed and suppressed deliberately.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
